<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFM3 in the Browser: minimal example</title>
<style>
  body { margin: 0 auto; max-width: 40rem; padding: 32px 16px; font: 16px/1.55 system-ui, -apple-system, sans-serif; color: #111214; background: #ffffff; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .muted { color: #74777f; font-size: 14px; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1px solid #e3e3e6; border-radius: 10px; }
  button { font: inherit; padding: 8px 16px; border-radius: 999px; border: 0; background: #111214; color: #ffffff; cursor: pointer; }
  button:disabled { opacity: 0.35; cursor: default; }
  #out { white-space: pre-wrap; min-height: 3em; }
</style>
</head>
<body>
<h1>Minimal example</h1>
<p class="muted">The smallest page that runs the engine: one call loads the language model into the GPU (and keeps it
on this device for next time), then it chats. Read this page's source. The full app is <a href="../">here</a>.</p>
<p><button id="load">Load the model (0.9 GB)</button> <span id="status" class="muted"></span></p>
<p><textarea id="q" rows="2" disabled>What is WebGPU? Answer in one sentence.</textarea></p>
<p><button id="ask" disabled>Ask</button></p>
<p id="out"></p>

<script type="module">
import { loadLFM3 } from "../engine/loader.js";

const $ = (id) => document.getElementById(id);
let chat = null;

$("load").onclick = async () => {
  $("load").disabled = true;
  try {
    // One call: WebGPU, the language model (from this device's copy when it has one), the tokenizer, and a chat
    // with its system prompt prefilled. base is the site's root, where weights.js, weights/ and the tokenizer are.
    ({ chat } = await loadLFM3({
      base: new URL("../", location.href),
      onProgress: (p) => { $("status").textContent = `${(p.got / 1e9).toFixed(2)} of ${(p.total / 1e9).toFixed(2)} GB`; },
    }));
    $("status").textContent = "Ready.";
    $("q").disabled = $("ask").disabled = false;
  } catch (e) {
    $("status").textContent = e.message;   // for example: no WebGPU in this browser
    $("load").disabled = false;
  }
};

$("ask").onclick = async () => {
  $("ask").disabled = true;
  const { reply, stats } = await chat.send($("q").value, { onText: (t) => { $("out").textContent = t; } });
  $("out").textContent = `${reply}\n\n${stats.newTokens} tokens at ${stats.decodeTokS.toFixed(1)} tokens/s`;
  $("ask").disabled = false;
};
</script>
</body>
</html>
