<!-- The smallest page that uses Voice Desk: d1-Omni-2B decides on each turn, LFM3-Omni-2B answers aloud with the
     decision. One loadPair() call, then pair.turn() per message. The full app is ../voice.html; the guide for
     building on this is docs/VOICE_DESK_HANDOFF.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Desk example</title>
<style>
  :root { color-scheme: light; --bg: #fff; --fg: #111214; --muted: #74777f; --line: #ececee; --soft: #f4f4f5; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: grid; gap: 12px; }
  textarea, button, input { font: inherit; }
  textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 5em; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  button.main { background: var(--fg); color: #fff; border-color: var(--fg); }
  button:disabled { opacity: 0.4; }
  pre { background: var(--soft); border-radius: 12px; padding: 12px; overflow-x: auto; font-size: 13px; margin: 0; }
  #log { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1 style="margin:0;font-size:20px">Voice Desk: a trades dispatch line</h1>
  <p id="log">Load the two models (about 2.1 GB, kept on this device after the first time).</p>
  <div class="row"><button class="main" id="load">Load</button></div>
  <textarea id="text" placeholder="Describe the job, e.g. Water is pouring out from under my sink. Can someone come today?" disabled></textarea>
  <div class="row">
    <button class="main" id="send" disabled>Send</button>
    <button id="rec" disabled>Record</button>
    <label><input type="file" id="photo" accept="image/*" disabled> photo</label>
  </div>
  <pre id="decision">The decision appears here.</pre>
  <p id="reply"></p>
</main>
<script type="module">
  import { loadPair } from "../engine/loader.js";
  import { makePlayer } from "../engine/play.js";
  import { PROFILES } from "../engine/profiles.js";

  const $ = (id) => document.getElementById(id);
  const profile = PROFILES["Trades dispatch"];
  let desk = null, player = null, recorder = null;

  $("load").onclick = async () => {
    $("load").disabled = true;
    player = makePlayer();   // in a tap, so iOS lets it play
    desk = await loadPair({ base: new URL("../", location.href), system: profile.system,
      onProgress: (p) => { $("log").textContent = `Loading ${p.label}: ${(p.got / 1e9).toFixed(2)} of ${(p.total / 1e9).toFixed(2)} GB`; } });
    $("log").textContent = "Ready. Type, record, or add a photo.";
    for (const id of ["text", "send", "rec", "photo"]) $(id).disabled = false;
  };

  // one turn: d1 decides, then LFM3 answers aloud with the decision as a note
  async function turn(input) {
    if (input.image) await desk.loadPictures();   // the image encoders, the first time (0.4 GB)
    player.ctx.resume?.();
    player.begin();
    $("reply").textContent = "…";
    const r = await desk.pair.turn(input, profile.questions, {
      onDecision: (d) => { $("decision").textContent = JSON.stringify(d.answers, null, 2); },   // send this to your backend
      onText: (t) => { $("reply").textContent = t; },
      onAudio: (x) => player.play(x),
    });
    player.end();
    $("log").textContent = `Decided in ${(r.decideMs / 1000).toFixed(1)} s, ${r.seconds.toFixed(1)} s of speech.`;
  }

  let photo = null;
  $("photo").onchange = async () => {
    const f = $("photo").files[0];
    if (!f) return;
    const bmp = await createImageBitmap(f), s = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
    const cv = new OffscreenCanvas(Math.round(bmp.width * s), Math.round(bmp.height * s));
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    photo = { rgba: cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data, w: cv.width, h: cv.height };
    $("log").textContent = "Photo added: it goes with the next message.";
  };
  $("send").onclick = async () => {
    const text = $("text").value.trim();
    if (!text && !photo) return;
    $("text").value = "";
    const image = photo; photo = null; $("photo").value = "";
    await turn({ text, image });
  };

  // a whole recording as one spoken turn (the full app streams it while you talk instead: pair.liveOpen/liveFeed/liveClose)
  $("rec").onclick = async () => {
    if (recorder) { recorder.stop(); return; }
    player.ctx.resume?.();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const parts = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => parts.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      recorder = null; $("rec").textContent = "Record";
      const ctx = new AudioContext(), audio = await ctx.decodeAudioData(await new Blob(parts).arrayBuffer());
      const off = new OfflineAudioContext(1, Math.ceil(Math.min(audio.duration, 30) * 16000), 16000);
      const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
      const samples = (await off.startRendering()).getChannelData(0);   // 16 kHz mono
      await turn({ samples, image: photo });
      photo = null;
    };
    recorder.start();
    $("rec").textContent = "Stop and send";
  };
</script>
</body>
</html>
